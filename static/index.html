<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BM Video DownLoad</title>
    <link rel="icon" type="image/png" href="/static/Cat.png">
    <!-- 引入外部字体 Inter，增强现代极简感 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- PWA 清单 -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d0e15">
    <link rel="apple-touch-icon" href="/static/Cat.png">
    <!-- 忽略防盗链机制，解决各大平台缩略图不显示问题 -->
    <meta name="referrer" content="no-referrer">
    <style>
/* style.css - Paste, Click, Download 终极胶囊界面 */
:root {
    --bg-dark: #0f1016;
    --text-main: #ffffff;
    --text-muted: #9ca3af;
    --input-bg: rgba(30, 30, 34, 0.8);
    --input-border: rgba(255, 255, 255, 0.1);
    --error-color: #ef4444;
    --success-color: #10b981;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20vh 1rem 2rem 1rem;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
}

.background-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    background:
        radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 85% 95%, rgba(6, 182, 212, 0.25) 0%, transparent 45%);
    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
}

header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

header h1 {
    font-size: 4rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    line-height: 1.1;
}

header p {
    color: var(--text-muted);
    font-size: 1.15rem;
    font-weight: 400;
}

.gradient-text {
    background: linear-gradient(to right, #22d3ee, #d946ef);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

main {
    width: 100%;
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    animation-fill-mode: both;
}

/* 胶囊输入区 */
.input-group {
    display: flex;
    background: var(--input-bg);
    border-radius: 999px;
    padding: 6px;
    width: 100%;
    max-width: 650px;
    margin: 0 auto 1.5rem auto;
    border: 1px solid var(--input-border);
    transition: all 0.3s ease;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    position: relative;
}

.input-group:focus-within {
    border-color: rgba(217, 70, 239, 0.4);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(217, 70, 239, 0.15);
}

.input-group input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-main);
    padding: 0 1.5rem;
    font-size: 1.05rem;
    outline: none;
    min-width: 0;
}

.input-group input::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

.input-group button {
    background: linear-gradient(to right, #0ea5e9, #a855f7);
    border: none;
    border-radius: 999px;
    padding: 0 2rem;
    height: 52px;
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 0 15px rgba(168, 85, 247, 0.3);
}

.input-group button:hover:not(:disabled) {
    filter: brightness(1.15);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), 0 0 20px rgba(168, 85, 247, 0.5);
}

.input-group button:active:not(:disabled) {
    transform: scale(0.98);
}

.input-group button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.arrow-icon {
    width: 20px;
    height: 20px;
}

/* Spinner component */
.spinner {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Error Message */
.error-message {
    margin: 2rem auto 0 auto;
    max-width: 650px;
    padding: 1rem;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 12px;
    color: #fca5a5;
    font-size: 0.95rem;
    text-align: center;
    animation: fadeIn 0.3s ease;
}

/* Results Section */
.result-container {
    margin: 2.5rem auto 0 auto;
    padding-top: 2.5rem;
    border-top: 1px solid var(--input-border);
    max-width: 650px;
    animation: fadeIn 0.4s ease-out;
}

.video-info {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.thumbnail {
    width: 140px;
    height: 80px;
    background-color: rgba(0, 0, 0, 0.4);
    border-radius: 12px;
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
}

.video-title {
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--text-main);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.4;
}

.formats-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
}

.format-card {
    background: rgba(30, 30, 34, 0.5);
    border: 1px solid var(--input-border);
    border-radius: 16px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transition: all 0.3s ease;
}

.format-card:hover {
    border-color: rgba(168, 85, 247, 0.5);
    background: rgba(40, 40, 45, 0.8);
    transform: translateY(-2px);
}

.format-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.resolution {
    font-size: 1.15rem;
    font-weight: 700;
    color: #f8fafc;
}

.badges {
    display: flex;
    gap: 0.4rem;
}

.badge {
    padding: 0.25rem 0.6rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    background: rgba(168, 85, 247, 0.2);
    color: #d8b4fe;
}

.badge.audio {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
}

.badge.no-audio {
    background: rgba(239, 68, 68, 0.15);
    color: #fca5a5;
}

.download-link {
    display: inline-block;
    width: 100%;
    text-align: center;
    padding: 0.8rem;
    background: rgba(255, 255, 255, 0.05);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.download-link:hover {
    background: rgba(168, 85, 247, 0.2);
    border-color: rgba(168, 85, 247, 0.5);
    color: #fff;
}

/* Donate Button & Modal */
.donate-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.donate-btn:hover {
    color: white;
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(217, 70, 239, 0.4);
}

.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}
.modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
}
.donate-modal {
    background: var(--bg-dark);
    border: 1px solid rgba(217, 70, 239, 0.3);
    border-radius: 20px;
    padding: 2rem;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    transform: translateY(20px);
    transition: transform 0.3s ease;
}
.modal-overlay.active .donate-modal {
    transform: translateY(0);
}
.donate-modal h3 {
    margin-bottom: 0.5rem;
    font-size: 1.5rem;
}
.qr-code-box {
    background: white;
    padding: 10px;
    border-radius: 12px;
    display: inline-block;
    margin-bottom: 1.5rem;
}
.qr-code-box img {
    width: 180px;
    height: 180px;
    display: block;
}
.wallet-address {
    background: rgba(255, 255, 255, 0.05);
    padding: 12px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 0.9rem;
    color: #22d3ee;
    word-break: break-all;
    margin-bottom: 1rem;
    border: 1px solid rgba(255,255,255,0.1);
}
.copy-btn {
    background: linear-gradient(to right, #0ea5e9, #a855f7);
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: all 0.3s;
}
.copy-btn:hover {
    filter: brightness(1.15);
}
.close-modal {
    margin-top: 15px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
}
.close-modal:hover {
    color: white;
}

.access-code-help {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0.75rem 0 1.25rem;
}

.access-code-help a {
    color: #67e8f9;
    text-decoration: none;
}

.access-code-help a:hover {
    text-decoration: underline;
}

.access-code-input {
    width: 100%;
    height: 46px;
    margin-bottom: 0.9rem;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-main);
    padding: 0 1rem;
    font-size: 1rem;
    outline: none;
}

.access-code-input:focus {
    border-color: rgba(217, 70, 239, 0.55);
}

.access-code-error {
    margin-bottom: 0.8rem;
    color: #fca5a5;
    font-size: 0.9rem;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
    body { padding-top: 15vh; }
    header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    header p { font-size: 0.95rem; }
    .input-group { border-radius: 999px; padding: 4px; max-width: 100%; }
    .input-group button { height: 46px; padding: 0 1rem; font-size: 1rem; }
    .input-group button span { display: none; }
    .input-group input { padding: 0 1rem; font-size: 0.95rem; }
    .social-icons { padding-left: 0; justify-content: center; gap: 1.2rem; }
}
    </style>
</head>

<body>
    <div class="background-glow"></div>
    <div class="container hero">
        <header>
            <h1>Paste, Click, <span class="gradient-text">Download</span>.</h1>
            <p>From YouTube, Instagram, X, Tiktok, Facebook.</p>
            <div style="margin-top: 15px;">
                <button id="donate-btn" class="donate-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    Sponsor / Donate
                </button>
            </div>
        </header>

        <main>
            <!-- 胶囊输入区域 -->
            <form class="input-group" id="download-form">
                <input type="url" id="video-url" placeholder="Paste your video link here..." required
                    autocomplete="off">
                <button type="submit" id="extract-btn">
                    <span>Search</span>
                    <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <polyline points="19 12 12 19 5 12"></polyline>
                    </svg>
                    <div class="spinner" style="display: none;"></div>
                </button>
            </form>

            <!-- 结果展示区域 -->
            <div id="result-container" class="result-container" style="display: none;">
                <div class="video-info">
                    <div id="video-thumbnail" class="thumbnail"></div>
                    <div class="video-title" id="video-title">Loading...</div>
                </div>
                <div id="formats-list" class="formats-list">
                    <!-- 分辨率列表由 JS 动态生成 -->
                </div>
            </div>

            <!-- 错误提示组件 -->
            <div id="error-message" class="error-message" style="display: none;"></div>
        </main>
    </div>

    <!-- 赞赏/打赏 Modal -->
    <div class="modal-overlay" id="donate-modal-overlay">
        <div class="donate-modal">
            <h3>Support the Project 💖</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Buy me a coffee via USDT (TRC-20)
            </p>
            <div class="qr-code-box">
                <!-- 优先读取可能存在的本地图片，若无则使用 API 实时生成 -->
                <img src="/static/usdt_qr.png" onerror="this.onerror=null; this.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=TFQcyiRDyHtJ32CH4AbvLiKKd1aQT1ibth';" alt="USDT TRC-20 QR Code">
            </div>
            <div class="wallet-address" id="wallet-address">TFQcyiRDyHtJ32CH4AbvLiKKd1aQT1ibth</div>
            <button class="copy-btn" id="copy-wallet-btn">Copy Address</button>
            <button class="close-modal" id="close-modal-btn">Close</button>
        </div>
    </div>

    <!-- 内联核心 JS（避免 Oracle ARM 网络层对大静态文件的传输中断问题） -->
    <script>
/** 
 * script.js
 * 处理前端所有的业务逻辑，包含平台切换、表单提交和结果渲染
 */

document.addEventListener('DOMContentLoaded', () => {
    const urlInput = document.getElementById('video-url');
    const form = document.getElementById('download-form');
    const extractBtn = document.getElementById('extract-btn');
    const btnText = extractBtn.querySelector('span');
    const spinner = extractBtn.querySelector('.spinner');

    const resultContainer = document.getElementById('result-container');
    const errorMessage = document.getElementById('error-message');

    // Donate Modal Logic
    const donateBtn = document.getElementById('donate-btn');
    const modalOverlay = document.getElementById('donate-modal-overlay');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const copyWalletBtn = document.getElementById('copy-wallet-btn');
    const walletAddress = document.getElementById('wallet-address').innerText;

    donateBtn.addEventListener('click', () => {
        modalOverlay.classList.add('active');
    });

    closeModalBtn.addEventListener('click', () => {
        modalOverlay.classList.remove('active');
        copyWalletBtn.innerText = "Copy Address";
    });

    modalOverlay.addEventListener('click', (e) => {
        if(e.target === modalOverlay) {
            modalOverlay.classList.remove('active');
            copyWalletBtn.innerText = "Copy Address";
        }
    });

    copyWalletBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(walletAddress).then(() => {
            copyWalletBtn.innerText = "Copied! ✔️";
            setTimeout(() => {
                copyWalletBtn.innerText = "Copy Address";
            }, 2000);
        });
    });

    // 搜索框焦点事件优化
    urlInput.addEventListener('focus', () => {
        resultContainer.style.display = 'none';
        errorMessage.style.display = 'none';
    });

    // 表单提交逻辑
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const url = urlInput.value.trim();
        if (!url) return;

        // UI 状态更新为加载中
        setLoadingState(true);
        resultContainer.style.display = 'none';
        errorMessage.style.display = 'none';

        try {
            const response = await fetch('/api/extract', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: url
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.detail || data.error || 'Failed to extract video information.');
            }
            renderResult(data, url);

        } catch (error) {
            showError(error.message);
        } finally {
            setLoadingState(false);
        }
    });

    /**
     * 渲染查询结果
     */
    function renderResult(data, origUrl) {
        document.getElementById('video-title').textContent = data.title;

        const thumbnailEl = document.getElementById('video-thumbnail');
        const fallbackGradient = 'linear-gradient(135deg, rgba(30, 30, 40, 1) 0%, rgba(15, 15, 20, 1) 100%)';
        thumbnailEl.style.backgroundImage = fallbackGradient;
        thumbnailEl.style.backgroundRepeat = 'no-repeat';
        thumbnailEl.style.backgroundPosition = 'center center';
        thumbnailEl.style.backgroundSize = 'cover';

        if (data.thumbnail && data.thumbnail.trim() !== "") {
            const needsProxy = ['facebook'].includes(data.platform);
            const proxyUrl = `/api/proxy_image?url=${encodeURIComponent(data.thumbnail)}`;
            const urlsToTry = needsProxy
                ? [proxyUrl, data.thumbnail]
                : [data.thumbnail, proxyUrl];

            function tryLoadThumb(urls, index) {
                if (index >= urls.length) return;
                const img = new Image();
                img.onload = function () {
                    thumbnailEl.style.backgroundImage = `url('${urls[index]}'), ${fallbackGradient}`;
                    thumbnailEl.style.backgroundRepeat = 'no-repeat, no-repeat';
                    thumbnailEl.style.backgroundPosition = 'center center, center center';
                    thumbnailEl.style.backgroundSize = 'cover, cover';
                };
                img.onerror = function () {
                    tryLoadThumb(urls, index + 1);
                };
                img.src = urls[index];
            }
            tryLoadThumb(urlsToTry, 0);
        }

        const formatsList = document.getElementById('formats-list');
        formatsList.innerHTML = '';

        if (!data.formats || data.formats.length === 0) {
            showError("No downloadable formats found for this video.");
            return;
        }

        data.formats.forEach(fmt => {
            const card = document.createElement('div');
            card.classList.add('format-card');

            const audioBadge = fmt.has_audio
                ? `<span class="badge audio">Audio</span>`
                : `<span class="badge no-audio">No Audio</span>`;

            const extBadge = `<span class="badge">${fmt.ext.toUpperCase()}</span>`;

            card.innerHTML = `
                <div class="format-info">
                    <span class="resolution">${fmt.resolution}</span>
                    <div class="badges">
                        ${extBadge}
                        ${audioBadge}
                    </div>
                </div>
                <a href="javascript:void(0);" onclick="forceDownload('${fmt.url}', '${fmt.ext}', ${fmt.needs_merge || false}, '${fmt.format_id || ''}', '${origUrl}', this)" class="download-link">
                    Download
                </a>
            `;
            formatsList.appendChild(card);
        });

        resultContainer.style.display = 'block';
    }

    function setLoadingState(isLoading) {
        if (isLoading) {
            extractBtn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';
        } else {
            extractBtn.disabled = false;
            btnText.style.display = 'block';
            spinner.style.display = 'none';
        }
    }

    function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
    }

    const ACCESS_CODE_STORAGE_KEY = 'videosnapAccessCode';

    function saveAccessCode(code) {
        localStorage.setItem(ACCESS_CODE_STORAGE_KEY, code);
        document.cookie = `access_code=${encodeURIComponent(code)}; Path=/; SameSite=Lax; Max-Age=2592000`;
    }

    function clearAccessCode() {
        localStorage.removeItem(ACCESS_CODE_STORAGE_KEY);
        document.cookie = 'access_code=; Path=/; SameSite=Lax; Max-Age=0';
    }

    function requestAccessCode(message = '') {
        return new Promise((resolve) => {
            const existing = document.querySelector('.access-code-overlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay access-code-overlay active';
            overlay.innerHTML = `
                <div class="donate-modal access-code-modal">
                    <h3>Access Code Required</h3>
                    <p class="access-code-help">
                        Donate any amount, then contact
                        <a href="mailto:li923745997@gmail.com">li923745997@gmail.com</a>
                        to get an access code.
                    </p>
                    ${message ? `<div class="access-code-error">${message}</div>` : ''}
                    <input class="access-code-input" type="password" placeholder="Enter access code" autocomplete="off">
                    <button class="copy-btn access-code-submit">Continue Download</button>
                    <button class="close-modal access-code-cancel">Cancel</button>
                </div>
            `;

            const input = overlay.querySelector('.access-code-input');
            const submit = overlay.querySelector('.access-code-submit');
            const cancel = overlay.querySelector('.access-code-cancel');

            function close(value) {
                overlay.remove();
                resolve(value);
            }

            submit.addEventListener('click', () => {
                const code = input.value.trim();
                if (!code) return;
                saveAccessCode(code);
                close(code);
            });
            cancel.addEventListener('click', () => close(null));
            overlay.addEventListener('click', (event) => {
                if (event.target === overlay) close(null);
            });
            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') submit.click();
                if (event.key === 'Escape') close(null);
            });

            document.body.appendChild(overlay);
            input.focus();
        });
    }

    async function getAccessCode() {
        const saved = localStorage.getItem(ACCESS_CODE_STORAGE_KEY);
        if (saved) {
            saveAccessCode(saved);
            return saved;
        }
        return requestAccessCode();
    }

    async function readError(response) {
        try {
            const data = await response.json();
            return data.detail || data.error || 'Download failed.';
        } catch {
            return 'Download failed.';
        }
    }

    /**
     * 实现彻底跨域下载
     */
    window.forceDownload = async function (directUrl, ext, needsMerge, formatId, origUrl, btnElement) {
        const originalText = btnElement.innerText;
        const accessCode = await getAccessCode();
        if (!accessCode) return;

        btnElement.innerText = "Downloading...";
        btnElement.style.pointerEvents = "none";
        btnElement.style.opacity = "0.7";
        try {
            let apiEndpoint = '/api/download?url=' + encodeURIComponent(directUrl) + '&ext=' + encodeURIComponent(ext);
            if (needsMerge) {
                apiEndpoint = '/api/download_merged?url=' + encodeURIComponent(origUrl) + '&format_id=' + encodeURIComponent(formatId);
            }

            const response = await fetch(apiEndpoint, { headers: { 'X-Access-Code': accessCode } });
            if (!response.ok) {
                const message = await readError(response);
                if (response.status === 401) {
                    clearAccessCode();
                }
                throw new Error(message);
            }
            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = objectUrl;
            a.download = "downloaded_file." + (ext || "mp4");
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(objectUrl);
        } catch (err) {
            console.warn(err);
            showError(err.message || 'Download failed.');
        } finally {
            btnElement.innerText = originalText;
            btnElement.style.pointerEvents = "auto";
            btnElement.style.opacity = "1";
        }
    }
});
    </script>

    <!-- 注册 PWA 桌面应用 Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/service-worker.js')
                    .then(reg => console.log('PWA ServiceWorker registered', reg.scope))
                    .catch(err => console.error('PWA SW register failed:', err));
            });
        }
    </script>
